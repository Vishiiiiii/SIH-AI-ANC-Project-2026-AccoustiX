# New reproducible dual-microphone training run. Do not overwrite default.yaml.
sample_rate: 16000
# Matches acoustix_rnnoise_128ms.onnx: 2,048 samples / 128 ms.
segment_seconds: 0.128
model: rnnoise
model_params:
  rnnoise:
    n_fft: 512
    hop_length: 128
    gru_hidden: 128

train:
  batch_size: 32
  # Zero avoids a Windows multiprocessing permission failure in this workspace.
  num_workers: 0
  epochs: 30
  lr: 0.001
  l1_weight: 0.1
  checkpoint_dir: checkpoints/dualmic_v1
  device: cuda

# Must match both preprocess_dualmic.py and realtime_demo_dualmic.py.
front_end:
  nlms_taps: 128
  nlms_mu: 0.002
  use_wiener: true

# These CSVs are generated by preprocess_dualmic.py. Their noisy_path is the
# exact NLMS + Wiener input used by the low-latency real-time path.
data:
  train_manifest: data/dual_mic_v1/manifests_front_end/train.csv
  val_manifest: data/dual_mic_v1/manifests_front_end/val.csv
  test_manifest: data/dual_mic_v1/manifests_front_end/test.csv
