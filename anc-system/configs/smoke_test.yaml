# Throwaway config for a fast CPU correctness check (NOT real training) —
# tiny data slice, 1 epoch, small checkpoint dir so it never collides with
# a real run's checkpoints/best_model.pt.
sample_rate: 16000
segment_seconds: 4
model: rnnoise               # overridden per-run via --model
model_params:
  rnnoise:
    n_fft: 512
    hop_length: 128
    gru_hidden: 128
  conv_tasnet:
    encoder_dim: 128
    kernel_size: 16
    stride: 8
    tcn_channels: 128
    tcn_blocks: 6
    tcn_repeats: 2
  dtln:
    n_fft: 512
    hop_length: 128
    lstm1_hidden: 128
    encoder_dim: 256
    encoder_kernel: 32
    lstm2_hidden: 128

train:
  batch_size: 4
  epochs: 1
  lr: 0.001
  l1_weight: 0.1
  checkpoint_dir: checkpoints/_smoke_test
  device: cpu

data:
  train_manifest: data/manifests/smoke_train.csv
  val_manifest: data/manifests/smoke_val.csv
  test_manifest: data/manifests/smoke_val.csv
